name: Build Pille (Android APK & iOS IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          CI: true
        run: |
          npm ci
          npm run build
          npx cap telemetry off || true
          npx cap sync android

      - name: Build Android APK (Debug-signed, direkt installierbar)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Pille-v3-Android.apk

      - name: Upload Pille-v3-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: Pille-v3-Android-APK
          path: artifacts/Pille-v3-Android.apk
          retention-days: 30

  build-ios-unsigned:
    name: Build iOS IPA (Unsigned fuer AltStore / Sideloadly)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & sync Capacitor iOS
        env:
          CI: true
        run: |
          npm ci
          npm run build
          npx cap telemetry off || true
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build Unsigned iOS App (.app)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package Unsigned .ipa
        run: |
          mkdir -p artifacts/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app artifacts/Payload/
          cd artifacts
          zip -qry Pille-v3-iOS-unsigned.ipa Payload

      - name: Upload Pille-v3-iOS-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Pille-v3-iOS-IPA
          path: artifacts/Pille-v3-iOS-unsigned.ipa
          retention-days: 30

      - name: Publish iOS IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build artifacts/Pille-v3-iOS-unsigned.ipa --clobber
          else
            gh release create latest-build artifacts/Pille-v3-iOS-unsigned.ipa \
              --title "Pille v3 Build" \
              --notes "Pille v3 (Android APK & unsignierte iOS IPA mit echten 60fps-Gelenk-Katzenanimationen)"
          fi
